<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable: double-tap zoom and pinch fight an on-screen control pad. iOS
         Safari ignores both by design; `touch-action: none` below is what actually protects gestures
         that start on the canvas. Deliberately NO `viewport-fit=cover`: it lays content into the
         notch / rounded corners / home-indicator strip, and the outermost pad buttons sit 16px from
         the edge — exactly where an iPhone would eat them. Without it the page stays inside the safe
         area for free. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vibe Fighter</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="description" content="A local two-player Street Fighter-style game. Three fighters, two rooftop stages, best of three. Plays in the browser on desktop and phone." />
    <meta name="theme-color" content="#120a1c" />
    <!-- Link preview. `og:image` must be ABSOLUTE — crawlers do not resolve relative URLs. These are
         inert metadata read by crawlers, never fetched by the page, so the `default-src 'none'` CSP
         does not apply to them. Both images live in public/ and are regenerated by
         `npm run demo -- --shots`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibe Fighter" />
    <meta property="og:title" content="Vibe Fighter" />
    <meta property="og:description" content="A local two-player Street Fighter-style game. Three fighters, two rooftop stages, best of three." />
    <meta property="og:url" content="https://vibe-fighter-dusky.vercel.app/" />
    <meta property="og:image" content="https://vibe-fighter-dusky.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibe Fighter" />
    <meta name="twitter:description" content="A local two-player Street Fighter-style game. Three fighters, two rooftop stages, best of three." />
    <meta name="twitter:image" content="https://vibe-fighter-dusky.vercel.app/og.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #10131a; overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* NOT a centering context. Phaser's `autoCenter: CENTER_BOTH` centres the canvas itself by
         writing marginLeft/marginTop (ScaleManager.updateCenter), and CSS grid centres the canvas's
         MARGIN BOX — so `place-items: center` here stacked with it and parked the canvas about a
         quarter of the letterbox gap to the right. One centerer, and it has to be the one that
         recomputes on every resize. Same reason the Phaser docs say not to style the canvas. */
      #game { position: relative; width: 100%; height: 100%; overflow: hidden; }
      /* `image-rendering: pixelated` used to be here and contradicted the renderer: main.ts
         deliberately does NOT set `pixelArt`, because the fighters are video-derived frames and the
         backgrounds are painted art. Nearest-neighbour resampling of that under Scale.FIT is exactly
         the shimmer/crunch LINEAR filtering exists to avoid, and a phone resamples every frame.
         `display: block` keeps the canvas off the inline baseline (no phantom descender gap).
         `touch-action: none`: without it a drag across the pad scrolls the page instead of holding
         a button. */
      canvas { display: block; touch-action: none; }

      /* The rotate gate. Shown only when src/main.ts puts `.rotate` on <html> — one tested decision
         (`shouldBlockForOrientation`) drives the overlay AND the loop pause, so the two cannot
         disagree about whether the game is playable right now. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #10131a;
        color: #fff;
        font-family: monospace;
        text-align: center;
        padding: 24px;
      }
      html.rotate #rotate { display: flex; }
      #rotate .glyph { font-size: 64px; color: #fd9146; }
      #rotate .title { font-size: 22px; letter-spacing: 2px; }
      #rotate .sub { font-size: 14px; color: #c9b8d4; }
    </style>
  </head>
  <body>
    <!-- #rotate lives INSIDE #game, and #game is the game's `fullscreenTarget`. Without a target
         Phaser creates its own <div>, moves ONLY the canvas into it and sends that fullscreen — which
         would leave this overlay outside the fullscreen subtree, i.e. a rotated phone in fullscreen
         would show a frozen canvas and no explanation of why. -->
    <div id="game">
      <div id="rotate" aria-live="polite">
        <div class="glyph">⟳</div>
        <div class="title">ROTATE YOUR DEVICE</div>
        <div class="sub">Vibe Fighter is played in landscape</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
